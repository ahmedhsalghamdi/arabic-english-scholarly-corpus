<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arabic–English Scholarly Corpus</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300&family=Noto+Naskh+Arabic:wght@400;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #1a1510;
    --ink-mid: #5a4e3e;
    --ink-light: #9a8e7e;
    --parchment: #f7f3ec;
    --parchment-dark: #ede7da;
    --parchment-darker: #dfd8c8;
    --gold: #b8860b;
    --gold-light: #d4a843;
    --red: #8b2020;
    --border: rgba(90,78,62,0.2);
  }

  body {
    font-family: 'Crimson Pro', Georgia, serif;
    background: var(--parchment);
    color: var(--ink);
    min-height: 100vh;
  }

  /* subtle paper texture via repeating gradient */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: repeating-linear-gradient(
      0deg, transparent, transparent 28px,
      rgba(90,78,62,0.03) 28px, rgba(90,78,62,0.03) 29px
    );
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 1;
    border-bottom: 1px solid var(--border);
    padding: 2.5rem 3rem 2rem;
    background: var(--parchment-dark);
  }

  .header-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .site-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
  }

  h1 {
    font-size: clamp(1.4rem, 3vw, 2.2rem);
    font-weight: 300;
    font-style: italic;
    color: var(--ink);
    line-height: 1.2;
  }

  h1 span {
    font-style: normal;
    font-weight: 600;
  }

  .arabic-title {
    font-family: 'Noto Naskh Arabic', serif;
    font-size: 1.1rem;
    color: var(--ink-mid);
    direction: rtl;
    margin-top: 2px;
  }

  .toolbar {
    position: relative;
    z-index: 1;
    background: var(--parchment-darker);
    border-bottom: 1px solid var(--border);
    padding: 1rem 3rem;
  }

  .toolbar-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 220px;
  }

  .search-wrap input {
    width: 100%;
    padding: 0.55rem 1rem 0.55rem 2.4rem;
    font-family: 'Crimson Pro', serif;
    font-size: 1.05rem;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: var(--parchment);
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
  }

  .search-wrap input:focus { border-color: var(--gold); }

  .search-icon {
    position: absolute;
    left: 0.7rem;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    opacity: 0.4;
    pointer-events: none;
  }

  select {
    padding: 0.55rem 0.8rem;
    font-family: 'Crimson Pro', serif;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: var(--parchment);
    color: var(--ink);
    cursor: pointer;
    outline: none;
  }

  .view-toggle {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 3px;
    overflow: hidden;
  }

  .view-toggle button {
    padding: 0.5rem 0.9rem;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border: none;
    background: var(--parchment);
    color: var(--ink-light);
    cursor: pointer;
    transition: all 0.15s;
  }

  .view-toggle button + button { border-left: 1px solid var(--border); }
  .view-toggle button.active { background: var(--ink); color: var(--parchment); }

  .stats-bar {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0.6rem 3rem;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--ink-light);
    letter-spacing: 0.05em;
  }

  .main {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 3rem 4rem;
  }

  /* PARALLEL VIEW */
  .parallel-table {
    width: 100%;
    border-collapse: collapse;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
  }

  .parallel-table thead th {
    padding: 0.6rem 1.2rem;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gold);
    background: var(--parchment-darker);
    border-bottom: 1px solid var(--border);
    font-weight: 400;
  }

  .parallel-table thead th:first-child { text-align: left; }
  .parallel-table thead th:last-child { text-align: right; }

  .parallel-table tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }

  .parallel-table tbody tr:last-child { border-bottom: none; }
  .parallel-table tbody tr:hover { background: var(--parchment-dark); }

  .cell-num {
    width: 38px;
    padding: 0.9rem 0.5rem 0.9rem 1rem;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--ink-light);
    vertical-align: top;
    border-right: 1px solid var(--border);
  }

  .cell-en {
    padding: 0.9rem 1.2rem;
    font-size: 1.05rem;
    line-height: 1.65;
    vertical-align: top;
    border-right: 1px solid var(--border);
    width: 50%;
  }

  .cell-ar {
    padding: 0.9rem 1.2rem;
    font-family: 'Noto Naskh Arabic', serif;
    font-size: 1.15rem;
    line-height: 1.8;
    direction: rtl;
    text-align: right;
    vertical-align: top;
    width: 50%;
  }

  mark {
    background: #f5e6a0;
    color: var(--ink);
    border-radius: 1px;
    padding: 0 1px;
  }

  /* CONCORDANCE VIEW */
  .conc-list { display: flex; flex-direction: column; }

  .conc-item {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: baseline;
    padding: 0.55rem 0;
    border-bottom: 1px solid var(--border);
    gap: 0;
    font-size: 1rem;
    line-height: 1.5;
  }

  .conc-left { text-align: right; color: var(--ink-mid); padding-right: 4px; }
  .conc-kw { color: var(--red); font-weight: 600; white-space: nowrap; padding: 0 2px; }
  .conc-right { color: var(--ink-mid); padding-left: 4px; }

  .conc-ar {
    font-family: 'Noto Naskh Arabic', serif;
    font-size: 0.95rem;
    direction: rtl;
    text-align: right;
    color: var(--ink-light);
    padding: 2px 0 8px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 2px;
  }

  /* LOADING / EMPTY */
  .message {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--ink-light);
    font-style: italic;
    font-size: 1.1rem;
  }

  .loading-spinner {
    display: inline-block;
    width: 18px; height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .ornament {
    text-align: center;
    color: var(--gold);
    font-size: 1.4rem;
    letter-spacing: 0.5em;
    padding: 0.5rem 0;
    opacity: 0.6;
  }

  @media (max-width: 680px) {
    header, .toolbar { padding-left: 1.2rem; padding-right: 1.2rem; }
    .stats-bar, .main { padding-left: 1.2rem; padding-right: 1.2rem; }
    .cell-en, .cell-ar { font-size: 0.95rem; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="site-label">Arabic–English Scholarly Corpus · ahmedhsalghamdi</div>
    <h1><span>Parallel</span> Texts in Arabic &amp; English</h1>
    <div class="arabic-title">مجموعة النصوص الموازية عربي–إنجليزي</div>
  </div>
</header>

<div class="toolbar">
  <div class="toolbar-inner">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="6.5" cy="6.5" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/>
      </svg>
      <input type="text" id="q" placeholder="Search in Arabic or English…" oninput="doSearch()" autocomplete="off">
    </div>
    <select id="lang" onchange="doSearch()">
      <option value="both">Both languages</option>
      <option value="en">English only</option>
      <option value="ar">Arabic only</option>
    </select>
    <select id="file" onchange="loadFile()">
      <option value="">— select text —</option>
    </select>
    <div class="view-toggle">
      <button class="active" onclick="setView('parallel')">Parallel</button>
      <button onclick="setView('conc')">Concordance</button>
    </div>
  </div>
</div>

<div class="stats-bar" id="stats"></div>

<div class="main">
  <div class="ornament">❧ · ❧</div>
  <div id="results"><div class="message"><span class="loading-spinner"></span>Loading corpus…</div></div>
</div>

<script>
const REPO = 'ahmedhsalghamdi/arabic-english-scholarly-corpus';
const BRANCH = 'main';
const API = `https://api.github.com/repos/${REPO}/contents/`;

let corpus = [];
let view = 'parallel';
let files = [];

async function init() {
  try {
    const r = await fetch(API + `?ref=${BRANCH}`);
    const items = await r.json();
    files = items.filter(f => f.name.endsWith('.csv'));
    const sel = document.getElementById('file');
    files.forEach(f => {
      const opt = document.createElement('option');
      opt.value = f.download_url;
      opt.textContent = f.name.replace(/\.csv$/i, '');
      sel.appendChild(opt);
    });
    if (files.length === 1) {
      sel.value = files[0].download_url;
      loadFile();
    } else {
      document.getElementById('results').innerHTML = '<div class="message">Select a text above to begin.</div>';
      document.getElementById('stats').textContent = files.length + ' texts available';
    }
  } catch(e) {
    document.getElementById('results').innerHTML = '<div class="message">Could not load repo. Make sure GitHub Pages is enabled and the repo is public.</div>';
  }
}

async function loadFile() {
  const url = document.getElementById('file').value;
  if (!url) return;
  document.getElementById('results').innerHTML = '<div class="message"><span class="loading-spinner"></span>Loading…</div>';
  corpus = [];
  try {
    const r = await fetch(url);
    const text = await r.text();
    const lines = text.trim().split('\n');
    for (const line of lines) {
      const cols = parseCSVLine(line);
      if (cols.length >= 2 && cols[0].trim() && cols[1].trim()) {
        corpus.push({ en: cols[0].trim().replace(/^"|"$/g,''), ar: cols[1].trim().replace(/^"|"$/g,'') });
      }
    }
    doSearch();
  } catch(e) {
    document.getElementById('results').innerHTML = '<div class="message">Could not load file.</div>';
  }
}

function parseCSVLine(line) {
  const result = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { inQ = !inQ; }
    else if (c === ',' && !inQ) { result.push(cur); cur = ''; }
    else { cur += c; }
  }
  result.push(cur);
  return result;
}

function setView(v) {
  view = v;
  document.querySelectorAll('.view-toggle button').forEach((b,i) => {
    b.classList.toggle('active', (i===0&&v==='parallel')||(i===1&&v==='conc'));
  });
  doSearch();
}

function hl(text, q) {
  if (!q) return text;
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return text.replace(re, '<mark>$1</mark>');
}

function doSearch() {
  const q = document.getElementById('q').value.trim();
  const lang = document.getElementById('lang').value;
  const stats = document.getElementById('stats');
  const results = document.getElementById('results');

  if (!corpus.length) return;

  const hits = corpus.filter(row => {
    if (!q) return true;
    const ql = q.toLowerCase();
    if (lang === 'en') return row.en.toLowerCase().includes(ql);
    if (lang === 'ar') return row.ar.includes(q);
    return row.en.toLowerCase().includes(ql) || row.ar.includes(q);
  });

  stats.textContent = q
    ? `${hits.length} of ${corpus.length} sentences match "${q}"`
    : `${corpus.length} sentence pairs loaded`;

  if (!hits.length) {
    results.innerHTML = '<div class="message">No results found.</div>';
    return;
  }

  if (view === 'parallel') {
    results.innerHTML = `
      <table class="parallel-table">
        <thead><tr>
          <th></th>
          <th style="text-align:left">English</th>
          <th style="text-align:right">العربية</th>
        </tr></thead>
        <tbody>
          ${hits.map((row, i) => `
            <tr>
              <td class="cell-num">${corpus.indexOf(row)+1}</td>
              <td class="cell-en">${hl(row.en, q)}</td>
              <td class="cell-ar">${hl(row.ar, q)}</td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  } else {
    const ql = q.toLowerCase();
    results.innerHTML = '<div class="conc-list">' + hits.map(row => {
      const idx = q ? row.en.toLowerCase().indexOf(ql) : -1;
      let line = '';
      if (idx > -1) {
        line = `<div class="conc-item">
          <span class="conc-left">${row.en.slice(0, idx)}</span>
          <span class="conc-kw">${row.en.slice(idx, idx+q.length)}</span>
          <span class="conc-right">${row.en.slice(idx+q.length)}</span>
        </div>`;
      } else {
        line = `<div class="conc-item"><span class="conc-left"></span><span class="conc-kw"></span><span class="conc-right">${row.en}</span></div>`;
      }
      return line + `<div class="conc-ar">${hl(row.ar, q)}</div>`;
    }).join('') + '</div>';
  }
}

init();
</script>
</body>
</html>
