<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arabic–English Scholarly Corpus</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 14px;
  background: #fff;
  color: #111;
  line-height: 1.5;
}

/* HEADER */
#header {
  border-bottom: 2px solid #111;
  padding: 18px 24px 14px;
}
#header h1 {
  font-size: 18px;
  font-weight: normal;
  letter-spacing: 0.01em;
}
#header p {
  font-size: 12px;
  color: #555;
  margin-top: 3px;
}

/* LAYOUT */
#layout {
  display: flex;
  min-height: calc(100vh - 62px);
}

/* SIDEBAR */
#sidebar {
  width: 230px;
  min-width: 230px;
  border-right: 1px solid #ccc;
  padding: 16px 14px;
  background: #f9f9f9;
}
#sidebar h2 {
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #444;
  border-bottom: 1px solid #ccc;
  padding-bottom: 6px;
  margin-bottom: 10px;
}
.sb-btns {
  display: flex;
  gap: 5px;
  margin-bottom: 10px;
}
.sb-btns button {
  font-family: Georgia, serif;
  font-size: 12px;
  padding: 3px 8px;
  border: 1px solid #aaa;
  background: #fff;
  cursor: pointer;
  color: #222;
}
.sb-btns button:hover { background: #eee; }

#book-list { display: flex; flex-direction: column; gap: 1px; }
.book-item {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  padding: 5px 4px;
  cursor: pointer;
  border-bottom: 1px solid #eee;
}
.book-item:last-child { border-bottom: none; }
.book-item input[type=checkbox] { margin-top: 2px; flex-shrink: 0; cursor: pointer; }
.book-item-name { font-size: 13px; color: #222; line-height: 1.35; }
.book-item-count { font-size: 11px; color: #888; margin-top: 1px; font-family: monospace; }

/* MAIN */
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* SEARCH BAR */
#searchbar {
  border-bottom: 1px solid #ccc;
  padding: 12px 18px;
  background: #f4f4f4;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.search-row { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
#q {
  flex: 1;
  min-width: 200px;
  padding: 5px 8px;
  font-family: Georgia, serif;
  font-size: 14px;
  border: 1px solid #aaa;
  background: #fff;
  color: #111;
  outline: none;
}
#q:focus { border-color: #333; }

select, .plain-btn {
  padding: 5px 8px;
  font-family: Georgia, serif;
  font-size: 13px;
  border: 1px solid #aaa;
  background: #fff;
  color: #111;
  cursor: pointer;
  outline: none;
}
select:focus { border-color: #333; }

.filter-row {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.filter-label {
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #555;
  white-space: nowrap;
}
.btn-group { display: flex; border: 1px solid #aaa; overflow: hidden; }
.btn-group button {
  font-family: Georgia, serif;
  font-size: 12px;
  padding: 4px 10px;
  border: none;
  border-right: 1px solid #aaa;
  background: #fff;
  color: #444;
  cursor: pointer;
}
.btn-group button:last-child { border-right: none; }
.btn-group button.active { background: #222; color: #fff; }
.btn-group button:hover:not(.active) { background: #eee; }

#excl {
  padding: 4px 8px;
  font-family: Georgia, serif;
  font-size: 13px;
  border: 1px solid #aaa;
  width: 170px;
  background: #fff;
  color: #111;
  outline: none;
}
#excl:focus { border-color: #333; }

/* STATS */
#stats {
  padding: 6px 18px;
  font-size: 12px;
  color: #555;
  border-bottom: 1px solid #eee;
  background: #fff;
  font-family: monospace;
}

/* RESULTS */
#results { padding: 0 0 40px; overflow-x: auto; }

/* PARALLEL TABLE */
.ptable {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.ptable thead th {
  text-align: left;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #555;
  background: #f0f0f0;
  border-bottom: 2px solid #bbb;
  border-top: 1px solid #ccc;
  padding: 7px 10px;
}
.ptable thead th.th-ar { text-align: right; }
.ptable tbody tr { border-bottom: 1px solid #e5e5e5; }
.ptable tbody tr:hover { background: #fafafa; }
.td-n {
  width: 36px;
  padding: 8px 4px 8px 10px;
  font-family: monospace;
  font-size: 11px;
  color: #999;
  vertical-align: top;
  border-right: 1px solid #e5e5e5;
  text-align: center;
}
.td-src {
  padding: 8px 6px;
  font-family: monospace;
  font-size: 10px;
  color: #888;
  vertical-align: top;
  border-right: 1px solid #e5e5e5;
  max-width: 80px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.td-en {
  padding: 8px 10px;
  line-height: 1.65;
  vertical-align: top;
  border-right: 1px solid #e5e5e5;
  width: 46%;
}
.td-ar {
  padding: 8px 10px;
  font-family: 'Traditional Arabic', 'Scheherazade New', Arial, sans-serif;
  font-size: 16px;
  line-height: 1.9;
  direction: rtl;
  text-align: right;
  vertical-align: top;
  width: 46%;
}

mark { background: #ffe066; color: #111; padding: 0 1px; }
mark.excl { background: #ffb3b3; }

/* CONCORDANCE */
.conc-list { display: flex; flex-direction: column; padding: 0 18px; }
.conc-item {
  padding: 7px 0;
  border-bottom: 1px solid #e5e5e5;
}
.conc-meta {
  font-family: monospace;
  font-size: 10px;
  color: #888;
  margin-bottom: 2px;
}
.conc-en {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: baseline;
  font-size: 14px;
  line-height: 1.5;
}
.conc-left { text-align: right; color: #333; padding-right: 3px; overflow: hidden; }
.conc-kw { font-weight: bold; color: #111; white-space: nowrap; padding: 0 2px; background: #ffe066; }
.conc-right { color: #333; padding-left: 3px; overflow: hidden; }
.conc-ar {
  font-family: 'Traditional Arabic', 'Scheherazade New', Arial, sans-serif;
  font-size: 14px;
  direction: rtl;
  text-align: right;
  color: #666;
  padding-top: 3px;
}

.msg {
  text-align: center;
  padding: 50px 20px;
  color: #888;
  font-size: 14px;
}
.spinner {
  display: inline-block;
  width: 14px; height: 14px;
  border: 2px solid #ccc;
  border-top-color: #333;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 680px) {
  #layout { flex-direction: column; }
  #sidebar { width: 100%; min-width: unset; border-right: none; border-bottom: 1px solid #ccc; }
  .td-ar { display: none; }
}
</style>
</head>
<body>

<div id="header">
  <h1>Arabic–English Scholarly Corpus</h1>
  <p>Parallel texts repository &mdash; ahmedhsalghamdi / arabic-english-scholarly-corpus</p>
</div>

<div id="layout">

  <aside id="sidebar">
    <h2>Texts</h2>
    <div class="sb-btns">
      <button onclick="selectAll(true)">Select all</button>
      <button onclick="selectAll(false)">Clear all</button>
    </div>
    <div id="book-list"><div class="msg" style="padding:10px 0;text-align:left;color:#888"><span class="spinner"></span>Loading…</div></div>
  </aside>

  <div id="main">
    <div id="searchbar">
      <div class="search-row">
        <input type="text" id="q" placeholder="Search in English or Arabic…" oninput="doSearch()" autocomplete="off">
        <select id="lang" onchange="doSearch()">
          <option value="both">Both languages</option>
          <option value="en">English only</option>
          <option value="ar">Arabic only</option>
        </select>
        <div class="btn-group">
          <button class="active" onclick="setView('parallel')">Parallel table</button>
          <button onclick="setView('conc')">Concordance</button>
        </div>
      </div>
      <div class="filter-row">
        <span class="filter-label">Match:</span>
        <div class="btn-group" id="mode-btns">
          <button class="active" onclick="setMode('any')" title="All words must appear, in any order, gaps allowed">Any order</button>
          <button onclick="setMode('exact')" title="Words must appear exactly as typed">Exact phrase</button>
          <button onclick="setMode('or')" title="At least one word must appear">Any word</button>
        </div>
        <span class="filter-label">Exclude phrase:</span>
        <input type="text" id="excl" placeholder="word or phrase to exclude…" oninput="doSearch()">
      </div>
    </div>

    <div id="stats">Ready.</div>
    <div id="results"><div class="msg"><span class="spinner"></span>Loading corpus files…</div></div>
  </div>
</div>

<script>
const REPO   = 'ahmedhsalghamdi/arabic-english-scholarly-corpus';
const BRANCH = 'main';

let books = [];
let view  = 'parallel';
let mode  = 'any';

/* ── INIT ── */
async function init() {
  try {
    const r     = await fetch(`https://api.github.com/repos/${REPO}/contents/?ref=${BRANCH}`);
    const items = await r.json();
    const csvs  = items.filter(f => f.name.toLowerCase().endsWith('.csv'));
    if (!csvs.length) {
      document.getElementById('book-list').innerHTML = '<div style="color:#c00;font-size:12px">No CSV files found in repository.</div>';
      document.getElementById('results').innerHTML   = '<div class="msg">Upload CSV files to your repository to get started.</div>';
      return;
    }
    books = await Promise.all(csvs.map(async f => ({
      name:    f.name.replace(/\.csv$/i, ''),
      pairs:   await loadCSV(f.download_url),
      checked: true
    })));
    renderSidebar();
    doSearch();
  } catch (e) {
    document.getElementById('book-list').innerHTML = '<div style="color:#c00;font-size:12px">Could not reach repository.</div>';
    document.getElementById('results').innerHTML   = '<div class="msg">Ensure the repository is public and GitHub Pages is enabled.</div>';
  }
}

async function loadCSV(url) {
  const r    = await fetch(url);
  const text = await r.text();
  const out  = [];
  for (const line of text.trim().split('\n')) {
    const cols = splitCSV(line);
    if (cols.length >= 2) {
      const en = cols[0].replace(/^"|"$/g, '').trim();
      const ar = cols[1].replace(/^"|"$/g, '').trim();
      if (en && ar) out.push({ en, ar });
    }
  }
  return out;
}

function splitCSV(line) {
  const res = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    if (line[i] === '"') q = !q;
    else if (line[i] === ',' && !q) { res.push(cur); cur = ''; }
    else cur += line[i];
  }
  res.push(cur);
  return res;
}

/* ── SIDEBAR ── */
function renderSidebar() {
  document.getElementById('book-list').innerHTML = books.map((b, i) => `
    <label class="book-item">
      <input type="checkbox" ${b.checked ? 'checked' : ''} onchange="toggle(${i}, this.checked)">
      <div>
        <div class="book-item-name">${esc(b.name)}</div>
        <div class="book-item-count">${b.pairs.length} pairs</div>
      </div>
    </label>`).join('');
}

function toggle(i, v) { books[i].checked = v; doSearch(); }
function selectAll(v) { books.forEach(b => b.checked = v); renderSidebar(); doSearch(); }

/* ── VIEW / MODE ── */
function setView(v) {
  view = v;
  document.querySelectorAll('#main .btn-group:first-of-type button').forEach((b, i) =>
    b.classList.toggle('active', i === (v === 'parallel' ? 0 : 1)));
  doSearch();
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('#mode-btns button').forEach((b, i) =>
    b.classList.toggle('active', ['any', 'exact', 'or'][i] === m));
  doSearch();
}

/* ── MATCHING ── */
function testMatch(text, q) {
  const t = text.toLowerCase(), ql = q.toLowerCase();
  const words = ql.split(/\s+/).filter(Boolean);
  if (mode === 'exact') return t.includes(ql);
  if (mode === 'or')    return words.some(w => t.includes(w));
  return words.every(w => t.includes(w));
}

/* ── SEARCH ── */
function doSearch() {
  const q      = document.getElementById('q').value.trim();
  const excl   = document.getElementById('excl').value.trim();
  const lang   = document.getElementById('lang').value;
  const active = books.filter(b => b.checked);

  if (!active.length) {
    document.getElementById('stats').textContent = 'No texts selected.';
    document.getElementById('results').innerHTML = '<div class="msg">Select at least one text from the sidebar.</div>';
    return;
  }

  const hits = []; let total = 0;
  for (const b of active) {
    for (const p of b.pairs) {
      total++;
      if (q) {
        const enOk = lang !== 'ar' && testMatch(p.en, q);
        const arOk = lang !== 'en' && testMatch(p.ar, q);
        if (!enOk && !arOk) continue;
      }
      if (excl) {
        const el = excl.toLowerCase();
        if (p.en.toLowerCase().includes(el) || p.ar.includes(excl)) continue;
      }
      hits.push({ ...p, src: b.name });
    }
  }

  document.getElementById('stats').textContent = [
    `${hits.length} of ${total} sentence pairs`,
    q    ? `| query: "${q}" (${mode})` : '',
    excl ? `| excluding: "${excl}"` : '',
    `| ${active.length} text${active.length > 1 ? 's' : ''} active`
  ].filter(Boolean).join('  ');

  const el = document.getElementById('results');
  if (!hits.length) {
    el.innerHTML = '<div class="msg">No results found. Try switching the match mode to "Any order" or "Any word".</div>';
    return;
  }

  if (view === 'parallel') {
    el.innerHTML = `<table class="ptable">
      <thead><tr>
        <th style="width:36px">#</th>
        <th style="width:80px">Source</th>
        <th>English</th>
        <th class="th-ar">Arabic</th>
      </tr></thead>
      <tbody>${hits.map((r, i) => `<tr>
        <td class="td-n">${i + 1}</td>
        <td class="td-src" title="${esc(r.src)}">${esc(abbr(r.src, 14))}</td>
        <td class="td-en">${hlText(r.en, q, excl)}</td>
        <td class="td-ar">${hlText(r.ar, q, excl)}</td>
      </tr>`).join('')}</tbody>
    </table>`;
  } else {
    const firstWord = q ? q.split(/\s+/)[0] : '';
    el.innerHTML = '<div class="conc-list">' + hits.map(r => {
      const fi = firstWord ? r.en.toLowerCase().indexOf(firstWord.toLowerCase()) : -1;
      const enLine = fi > -1
        ? `<div class="conc-en">
            <span class="conc-left">${esc(r.en.slice(0, fi))}</span>
            <span class="conc-kw">${esc(r.en.slice(fi, fi + firstWord.length))}</span>
            <span class="conc-right">${esc(r.en.slice(fi + firstWord.length))}</span>
           </div>`
        : `<div class="conc-en"><span></span><span></span><span class="conc-right">${esc(r.en)}</span></div>`;
      return `<div class="conc-item">
        <div class="conc-meta">${esc(r.src)}</div>
        ${enLine}
        <div class="conc-ar">${esc(r.ar)}</div>
      </div>`;
    }).join('') + '</div>';
  }
}

function hlText(text, q, excl) {
  let out = esc(text);
  if (excl) out = out.replace(new RegExp('(' + re(excl) + ')', 'gi'), '<mark class="excl">$1</mark>');
  if (q) {
    const terms = mode === 'exact' ? [q] : q.split(/\s+/).filter(Boolean);
    for (const t of terms) out = out.replace(new RegExp('(' + re(t) + ')', 'gi'), '<mark>$1</mark>');
  }
  return out;
}

function esc(t)     { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function re(s)      { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function abbr(n, l) { return n.length > l ? n.slice(0, l - 1) + '…' : n; }

init();
</script>
</body>
</html>
